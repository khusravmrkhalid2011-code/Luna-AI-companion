<title>Luna Companion</title>
<style>
:root{
  --bg:#ffffff;--side:#f0f4f9;--surface:#f0f4f9;--surface2:#e9eef6;--text:#1f1f1f;--muted:#5f6368;--line:#dde3ea;
  --accent:#0b57d0;--accent-bg:#d3e3fd;--hover:rgba(31,31,31,.08);--user:#e9eef6;
  --font:"Google Sans","Google Sans Text","Product Sans",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131314;--side:#1e1f20;--surface:#1e1f20;--surface2:#282a2c;--text:#e3e3e3;--muted:#9aa0a6;--line:#37393b;--accent:#a8c7fa;--accent-bg:#0842a0;--hover:rgba(227,227,227,.1);--user:#282a2c;color-scheme:dark}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#131314;--side:#1e1f20;--surface:#1e1f20;--surface2:#282a2c;--text:#e3e3e3;--muted:#9aa0a6;--line:#37393b;
  --accent:#a8c7fa;--accent-bg:#0842a0;--hover:rgba(227,227,227,.1);--user:#282a2c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{height:100vh;height:100dvh}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spacer{flex:1}
[hidden]{display:none!important}
#app{display:flex}

/* sidebar */
#sidebar{width:280px;background:var(--side);display:flex;flex-direction:column;padding:8px 12px 12px;transition:margin .2s,width .2s;flex:none;overflow:hidden}
#app.collapsed #sidebar{width:0;padding:0;margin-left:0}
.sb-top{height:56px;display:flex;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover)}
.new-chat{display:flex;gap:12px;align-items:center;height:44px;padding:0 16px;margin:8px 0 18px;border-radius:22px;background:var(--surface2);color:var(--muted);width:max-content;min-width:140px}
.new-chat:hover{filter:brightness(.97)}
.sb-label{font-size:14px;font-weight:500;padding:8px 12px;color:var(--text)}
#chat-list{flex:1;overflow:auto;margin:0 -4px}
.chat-item{display:flex;align-items:center;gap:4px;padding:0 4px 0 14px;height:40px;border-radius:20px;color:var(--text);font-size:14px;cursor:pointer}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--accent-bg);color:var(--accent)}
.chat-item .del{opacity:0;width:28px;height:28px;border-radius:50%;color:var(--muted)}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{background:var(--hover)}
.sb-bottom{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.sb-item{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;border-radius:22px;font-size:14px;color:var(--text);text-align:left}
.sb-item:hover{background:var(--hover)}
.sb-item b{margin-left:auto;background:var(--accent-bg);color:var(--accent);border-radius:10px;font-size:12px;padding:0 8px;font-weight:500}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{height:64px;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.brand{font-size:22px;font-weight:500;padding:0 8px;letter-spacing:.2px}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 14px;border-radius:18px;font-size:14px;color:var(--muted);background:var(--surface)}
.pill svg{width:18px;height:18px}
.pill:hover{background:var(--surface2)}
.face-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:var(--surface2);font-size:14px;color:var(--text)}
.face-btn:hover{filter:brightness(.96)}
.mobile-only{display:none}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
#empty{max-width:760px;margin:0 auto;padding:7vh 24px 0}
.greet{font-size:clamp(34px,6vw,56px);font-weight:500;margin:0;letter-spacing:-1px;line-height:1.1}
.grad{background:linear-gradient(74deg,#4285f4 0,#9b72cb 9%,#d96570 20%,#d96570 24%,#9b72cb 35%,#4285f4 44%,#9b72cb 50%,#d96570 56%);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 12s linear infinite}
@keyframes flow{to{background-position:-400% 0}}
.sub{font-size:clamp(28px,5vw,52px);font-weight:500;margin:4px 0 36px;color:var(--muted);opacity:.65;letter-spacing:-1px;line-height:1.15}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.chip{height:190px;border-radius:16px;background:var(--surface);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:15px;color:var(--text);position:relative}
.chip:hover{background:var(--surface2)}
.chip i{font-style:normal;align-self:flex-end;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px}
#messages{max-width:820px;margin:0 auto;padding:8px 24px 24px}
.msg-user{display:flex;justify-content:flex-end;margin:22px 0 10px}
.msg-user .bubble{background:var(--user);border-radius:22px 22px 6px 22px;padding:12px 18px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.msg-luna{display:flex;gap:16px;margin:12px 0 24px}
.avatar{width:34px;height:34px;border-radius:50%;background:#05070d;flex:none;display:grid;place-items:center;margin-top:2px;overflow:hidden}
.avatar svg{width:26px;height:26px;stroke:#5ee7ff;stroke-width:3}
.luna-body{flex:1;min-width:0}
.luna-text{word-wrap:break-word;overflow-wrap:anywhere}
.luna-text p{margin:0 0 12px}
.luna-text pre{background:var(--surface);border-radius:12px;padding:14px 16px;overflow:auto;font-size:14px;line-height:1.45}
.luna-text code{font-family:"Roboto Mono",Consolas,monospace;font-size:.92em;background:var(--surface);padding:1px 6px;border-radius:6px}
.luna-text pre code{background:none;padding:0}
.luna-text a{color:var(--accent)}
.luna-text ul,.luna-text ol{margin:0 0 12px;padding-left:24px}
.luna-text h1,.luna-text h2,.luna-text h3{margin:16px 0 8px;font-weight:500}
.typing{display:inline-flex;gap:5px;padding:8px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.actions{display:flex;gap:2px;margin-top:2px;opacity:.0;transition:opacity .15s}
.msg-luna:hover .actions,.msg-luna:last-child .actions{opacity:1}
.actions .icon-btn{width:34px;height:34px}.actions svg{width:18px;height:18px}
.err{color:#d93025;background:rgba(217,48,37,.08);padding:10px 14px;border-radius:12px}

/* composer */
#composer-wrap{padding:0 16px 10px;flex:none}
#composer{max-width:820px;margin:0 auto;background:var(--surface);border-radius:28px;padding:10px 12px 8px 20px;box-shadow:0 0 0 1px transparent;transition:box-shadow .15s,background .15s}
#composer:focus-within{background:var(--surface2)}
#input{width:100%;border:0;outline:0;background:none;resize:none;font:inherit;color:var(--text);max-height:200px;padding:8px 0;line-height:1.5}
#input::placeholder{color:var(--muted)}
.comp-row{display:flex;align-items:center;gap:4px}
.plus-wrap{position:relative}
#plus-menu{position:absolute;bottom:46px;left:0;background:var(--surface2);border-radius:16px;padding:8px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,.25);z-index:5}
#plus-menu button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;font-size:14px}
#plus-menu button:hover{background:var(--hover)}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.send:not(:disabled):hover{background:var(--hover)}
.send:disabled{opacity:.35;cursor:default}
.icon-btn.rec{background:#d93025;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(217,48,37,.2)}}
.fine{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}

/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.card{background:var(--bg);color:var(--text);border-radius:24px;padding:20px 24px 22px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.4)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card-head h3{margin:0;font-weight:500;font-size:22px}
.card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.card label small{color:var(--accent);margin-left:6px}
.card input[type=text],.card input[type=password],.card input[type=time],.card select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font:inherit;font-size:15px;outline:0}
.card input:focus,.card select:focus{border-color:var(--accent)}
.card input[type=range]{width:100%;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex!important;align-items:center;gap:10px;color:var(--text)!important;font-size:14px!important}
.stats{margin-top:14px;font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 14px;line-height:1.6}
.card-actions{display:flex;gap:8px;margin-top:18px;align-items:center}
.ghost{height:40px;padding:0 16px;border-radius:20px;color:var(--accent);font-size:14px;font-weight:500}
.ghost:hover{background:var(--hover)}
.primary-btn{height:40px;padding:0 24px;border-radius:20px;background:var(--accent);color:var(--bg);font-weight:500;font-size:14px}
.msg{font-size:13px;min-height:18px;margin-top:10px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 0}
#rem-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rem-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px;font-size:14px}
.rem-item b{font-weight:500;min-width:54px}.rem-item span{flex:1}
.rem-item small{color:var(--muted)}
.rem-empty{color:var(--muted);font-size:14px;padding:6px 2px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#303030;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 4px 18px rgba(0,0,0,.35)}

/* face stage */
#stage{position:fixed;inset:0;height:100vh;height:100dvh;background:#05070d;z-index:80;display:flex;flex-direction:column;color:#e8f0ff;user-select:none}
#face{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.stage-btn{background:rgba(255,255,255,.1);color:#e8f0ff;border-radius:22px;height:44px;padding:0 18px;font-size:15px;backdrop-filter:blur(6px)}
.stage-btn:hover{background:rgba(255,255,255,.18)}
.stage-btn.primary{background:#5ee7ff;color:#05070d;font-weight:600}
.stage-btn.round{width:46px;padding:0;border-radius:50%;display:grid;place-items:center}
.stage-btn.on{background:#d93025;color:#fff}
#stage-close{position:absolute;top:16px;left:16px;width:44px;padding:0}
#stage-tools{position:absolute;top:16px;right:16px;display:flex;gap:8px}
#stage-status{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:13px;color:#8fa3c8;letter-spacing:.3px;min-height:18px}
#caption{flex:none;text-align:center;padding:0 7vw;font-size:clamp(16px,2.4vw,22px);color:#cfe0ff;text-shadow:0 2px 8px #000;pointer-events:none;min-height:34px;max-height:68px;overflow:hidden}
#stage-bottom{flex:none;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
#emoji-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:720px}
#emoji-row button{font-size:22px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.07)}
#emoji-row button:hover{background:rgba(255,255,255,.18);transform:scale(1.12)}
.stage-input{display:flex;gap:8px;width:min(720px,100%)}
#stage-text{flex:1;height:46px;border-radius:23px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;padding:0 20px;font:inherit;font-size:16px;outline:0}
#stage-text:focus{border-color:#5ee7ff}
#rem-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin-top:0;text-align:center;pointer-events:none}
#rem-box{top:72px;bottom:auto;transform:translateX(-50%);width:min(90vw,640px)}
#rem-title{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#8fa3c8}
#rem-text{font-size:clamp(24px,4vw,38px);font-weight:500;margin:4px 0 14px;text-shadow:0 2px 12px #000}
.rem-actions{display:flex;gap:10px;justify-content:center;pointer-events:auto}
#stage.reminder #stage-bottom,#stage.reminder #stage-tools{display:none}
#stage.reminder #caption{visibility:hidden}
#stage.flash #stage-bottom,#stage.flash #stage-tools,#stage.flash #stage-close{display:none}
#stage.flash #caption{visibility:hidden}
#stage.flash{pointer-events:none}

@media (max-width:820px){
  #sidebar{position:fixed;z-index:30;left:0;top:0;bottom:0;box-shadow:0 0 30px rgba(0,0,0,.4)}
  #app.collapsed #sidebar{margin-left:-280px;width:280px;padding:8px 12px 12px}
  #app:not(.collapsed) #sidebar{width:280px}
  .mobile-only{display:grid}
  .face-btn span{display:none}.face-btn{padding:0 12px}
  .chip{height:130px}
  #emoji-row button{width:36px;height:36px;font-size:19px}
}

@media (max-width:820px){
  header{padding:0 8px;height:56px}.brand{font-size:20px}
  #composer-wrap{padding:0 10px calc(8px + env(safe-area-inset-bottom))}
  #messages{padding:8px 14px 20px}#empty{padding:4vh 18px 0}
  .msg-user .bubble{max-width:88%}
  #stage-bottom{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  #stage-text{font-size:16px}
  .stage-btn{height:42px;padding:0 14px}#stage-close{width:42px}
  #stage-tools{top:12px;right:12px}#stage-close{top:12px;left:12px}
  #stage-status{top:64px;font-size:12px;max-width:80vw;text-align:center}
}
@media (max-width:820px) and (orientation:landscape){#emoji-row{display:none}}

@media (max-width:820px){#sidebar{transition:none}}

html{box-sizing:border-box}
#stage-close,#stage-tools{top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:820px){#stage-status{top:calc(64px + env(safe-area-inset-top,0px))}}
#stage-bottom{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

</style>

  <main id="main">
    <header>
      <button class="icon-btn mobile-only" id="btn-menu2" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="brand">Luna</div>
